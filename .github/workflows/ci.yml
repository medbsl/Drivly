name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: obd_core
        working-directory: packages/obd_core
        run: |
          dart format --output=none --set-exit-if-changed --line-length 140 lib test || true
          dart analyze --fatal-infos
          dart test
      - name: app
        working-directory: app
        run: |
          flutter analyze
          flutter test
