name: drivly
description: "Drivly: a calm, open-source OBD2 companion. Live data, fault codes and full history, all on your phone."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.2
  obd_core:
    path: ../packages/obd_core
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2
  universal_ble: ^3.3.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/dtc/
